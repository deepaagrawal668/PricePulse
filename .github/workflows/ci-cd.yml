on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
jobs:
  backend-build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
      - name: Build with Maven
        run: mvn -B package --file backend/pom.xml
      - name: Run Tests
        run: mvn test --file backend/pom.xml
  frontend-build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
      - name: Install Dependencies
        run: npm install --prefix frontend
      - name: Run Lint
        run: npm run lint --prefix frontend
      - name: Run Tests
        run: npm test --prefix frontend -- --watchAll=false
      - name: Build
        run: npm run build --prefix frontend
  ml-service-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - name: Install Dependencies
        run: pip install -r ml-service/app/requirements.txt
      - name: Run Tests
        run: pytest ml-service/app
  docker-build-deploy:
    runs-on: ubuntu-latest
    needs: [backend-build-test, frontend-build-test, ml-service-test]
    steps:
      - uses: actions/checkout@v3
      - name: Log in to DockerHub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Build and Push Images
        run: |
          docker build -t myrepo/backend ./backend
          docker build -t myrepo/frontend ./frontend
          docker build -t myrepo/ml-service ./ml-service
          docker push myrepo/backend
          docker push myrepo/frontend
          docker push myrepo/ml-service
      - name: Deploy with Docker Compose
        run: docker-compose -f deployment/docker-compose.yml up -d
